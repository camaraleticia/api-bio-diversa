version: '3.8'

services:
  # Serviço PHP
  php:
    build:
      context: docker/php
      dockerfile: Dockerfile
    container_name: carbonifera_php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - carbonifera_network

  # Serviço Nginx
  nginx:
    image: nginx:stable-alpine
    container_name: carbonifera_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src/public/uploads/images:/var/www/html/uploads/images    # Imagens upload, que sobem no site.
      - ./src/app/Views/img:/img   # encontrar imagens do front
    depends_on:
      - php
    networks:
      - carbonifera_network

  # Serviço MySQL
  mysql:
    image: mysql:8.0
    container_name: carbonifera_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: carbonifera_db
      MYSQL_USER: carbonifera_user
      MYSQL_PASSWORD: carbonifera_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - carbonifera_network

networks:
  carbonifera_network:
    driver: bridge

volumes:
  mysql_data:
